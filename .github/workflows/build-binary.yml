name: Build wayland-pipewire-idle-inhibit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-binary.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev \
            libpipewire-0.3-dev \
            pkg-config

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Build wayland-pipewire-idle-inhibit
        run: cargo install wayland-pipewire-idle-inhibit --root ./out

      - name: Create or update the 'binaries' release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: binaries
          name: "Pre-built binaries"
          body: |
            Pre-built `wayland-pipewire-idle-inhibit` binary for x86\_64 Linux,
            built automatically from the latest crates.io release.

            The `install` script downloads this binary directly so you do not
            need Rust or `cargo` on the target machine.
          make_latest: true
          files: out/bin/wayland-pipewire-idle-inhibit
